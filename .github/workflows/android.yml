name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: APK (armeabi-v7a, full game)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove SDL's sample Gradle wrapper
        # external/SDL/android-project ships a gradle-wrapper.jar for SDL's own sample
        # project. This build never runs it (it uses the Gradle set up below), and
        # gradle/actions cannot match its checksum, so it is deleted from the checkout.
        run: rm -f external/SDL/android-project/gradle/wrapper/gradle-wrapper.jar

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Tools
        # GNU objdump for 32-bit ARM ELF: tools/port/gen_widths.py reads the game objects' DWARF with it
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-linux-gnueabihf ninja-build

      - name: Build
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dd64-android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  arm64-check:
    name: arm64-v8a (probe APK + conversion status)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove SDL's sample Gradle wrapper
        # external/SDL/android-project ships a gradle-wrapper.jar for SDL's own sample
        # project. This build never runs it (it uses the Gradle set up below), and
        # gradle/actions cannot match its checksum, so it is deleted from the checkout.
        run: rm -f external/SDL/android-project/gradle/wrapper/gradle-wrapper.jar

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: arm64 address-space probe APK
        # A stand-in libdd64.so that checks the RAM image can be mapped at 0x80000000
        # in a 64-bit process (android/probe.c)
        run: |
          gradle --no-daemon -Pdd64.abis=arm64-v8a -Pdd64.probe=true assembleDebug
          mkdir -p probe && cp app/build/outputs/apk/debug/*.apk probe/dd64-arm64-probe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dd64-arm64-probe-apk
          path: probe/dd64-arm64-probe.apk

      - name: arm64 conversion status (informational)
        # The game's C is not converted to 64-bit yet (docs/ARM64.md), so this build is
        # expected to fail; its errors are the to-do list, written to the job summary.
        # It turns into a required check once the conversion links.
        id: arm64
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon -Pdd64.abis=arm64-v8a -Pdd64.probe=false externalNativeBuildDebug 2>&1 | tee arm64.log

      - name: arm64 conversion summary
        if: always()
        run: |
          {
            echo "## arm64-v8a conversion"
            if [ "${{ steps.arm64.outcome }}" = success ]; then
              echo "The native code builds for arm64-v8a."
            else
              echo "Not converted yet (expected, docs/ARM64.md). Compiler errors:"
              echo '```'
              grep -E "error:" arm64.log | sed 's/.*external\/dd64\///' | sort | uniq -c | sort -rn | head -40 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  nightly:
    # The latest APKs from main as a rolling pre-release, so a phone (or adb on a
    # PC) can download them without signing in to GitHub
    name: Publish nightly pre-release
    needs: [apk, arm64-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p out
          cp dl/dd64-android-debug-apk/*.apk out/dd64-armeabi-v7a-debug.apk
          if [ -f dl/dd64-arm64-probe-apk/dd64-arm64-probe.apk ]; then cp dl/dd64-arm64-probe-apk/dd64-arm64-probe.apk out/; fi
          gh release delete nightly --repo "$REPO" --yes --cleanup-tag || true
          gh release create nightly out/*.apk --repo "$REPO" --prerelease --target "$GITHUB_SHA" \
            --title "Nightly (${GITHUB_SHA::7})" \
            --notes "Builds automáticos do último commit em main. Sem dados da ROM: escolha a sua ROM no app."
